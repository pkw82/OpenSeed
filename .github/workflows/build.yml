name: Build and test

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            binary: target/release/openseed
          - name: Windows
            os: windows-latest
            binary: target/release/openseed.exe
          - name: Linux
            os: ubuntu-latest
            binary: target/release/openseed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --release

      - name: Build release
        run: cargo build --locked --release

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openseed-${{ matrix.name }}
          path: dist/
